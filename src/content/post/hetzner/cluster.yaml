cluster_name: k3s
kubeconfig_path: "./kubeconfig"
k3s_version: v1.35.1+k3s1

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.ssh/id_ed25519.pub"
    private_key_path: "~/.ssh/id_ed25519"
  allowed_networks:
    ssh:
      - 0.0.0.0/0
      - ::/0
    api:
      - 0.0.0.0/0
      - ::/0
  public_network:
    ipv4: true
    ipv6: true
  private_network:
    enabled: true
    subnet: 10.0.0.0/16
    existing_network_name: ""
  custom_firewall_rules:
    - description: "Allow HTTP"
      direction: in
      protocol: tcp
      port: 80
      source_ips:
        - 0.0.0.0/0
        - ::/0
    - description: "Allow HTTPS"
      direction: in
      protocol: tcp
      port: 443
      source_ips:
        - 0.0.0.0/0
        - ::/0

schedule_workloads_on_masters: true

masters_pool:
  instance_type: cx23
  instance_count: 1
  locations:
    - nbg1

worker_node_pools: []

addons:
  csi_driver:
    enabled: false
  local_path_storage_class:
    enabled: true
  traefik:
    enabled: true
  servicelb:
    enabled: true

protect_against_deletion: true
